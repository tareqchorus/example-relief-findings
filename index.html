<style>
/* ============ Chorus v4 design tokens (authoritative: chorus-front-end@robinsingh/design-system-canvas-builder) ============ */
[data-chorus-v4]{
  --v4-primary:#7c3aed; --v4-primary-alt:#a78bfa; --v4-primary-hover:#8b46f0; --v4-primary-active:#6d28d9;
  --v4-brand-gradient:linear-gradient(135deg,#7c3aed,#a78bfa);
  --v4-bg:#0a0a0a; --v4-surface:#111111; --v4-surface-2:#161616; --v4-border:#222222; --v4-border-soft:#1f1f1f;
  --v4-text-1:#ffffff; --v4-text-2:rgba(255,255,255,.65); --v4-text-3:rgba(255,255,255,.45); --v4-text-4:rgba(255,255,255,.28);
  --v4-state-success:#38c793; --v4-state-warning:#f17b2c; --v4-state-error:#df1c41; --v4-state-info:#375dfb;
  --v4-purple-12:rgba(124,58,237,.16); --v4-purple-20:rgba(124,58,237,.28);
  --grid:rgba(255,255,255,.08); --neutral:rgba(255,255,255,.30); --accent:#a78bfa;
}
[data-chorus-v4][data-theme='light']{
  --v4-bg:#ffffff; --v4-surface:#faf9fb; --v4-surface-2:#ffffff; --v4-border:#e7e5ea; --v4-border-soft:#efedf2;
  --v4-text-1:#12101a; --v4-text-2:rgba(18,16,26,.72); --v4-text-3:rgba(18,16,26,.5); --v4-text-4:rgba(18,16,26,.32);
  --v4-purple-12:rgba(124,58,237,.10); --v4-purple-20:rgba(124,58,237,.25);
  --grid:rgba(18,16,26,.09); --neutral:rgba(18,16,26,.34); --accent:#6d28d9;
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{
  background:var(--v4-bg); color:var(--v4-text-1);
  font-family:'Geist','Geist Sans',ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; line-height:1.5;
}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}

/* ---- header ---- */
header.top{border-bottom:1px solid var(--v4-border);position:sticky;top:0;background:color-mix(in srgb,var(--v4-bg) 88%,transparent);z-index:20;backdrop-filter:blur(8px)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;letter-spacing:-.01em}
.dot{width:9px;height:9px;border-radius:50%;background:var(--v4-brand-gradient);box-shadow:0 0 10px rgba(124,58,237,.55)}
.toggle{font:inherit;font-size:12px;color:var(--v4-text-2);background:var(--v4-surface);border:1px solid var(--v4-border);border-radius:8px;padding:6px 12px;cursor:pointer}
.toggle:hover{color:var(--v4-text-1);border-color:var(--accent)}
.nav{display:flex;gap:4px;margin-left:26px;margin-right:auto}
.nav a{font-size:13px;font-weight:500;color:var(--v4-text-2);text-decoration:none;padding:6px 12px;border-radius:8px}
.nav a:hover{color:var(--v4-text-1)}
.nav a.on{color:var(--accent);background:var(--v4-purple-12)}

/* ---- hero ---- */
.hero{padding:72px 0 40px;border-bottom:1px solid var(--v4-border)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.hero h1{font-size:clamp(34px,5vw,56px);font-weight:600;letter-spacing:-.03em;line-height:1.02;margin:16px 0 18px;max-width:16ch}
.hero .lede{font-size:17px;color:var(--v4-text-2);max-width:60ch;line-height:1.6}
.strip{display:flex;flex-wrap:wrap;gap:0;margin-top:36px;border:1px solid var(--v4-border);border-radius:14px;overflow:hidden;background:var(--v4-surface)}
.strip .cell{flex:1 1 150px;padding:18px 20px;border-right:1px solid var(--v4-border)}
.strip .cell:last-child{border-right:0}
.strip .n{font-size:26px;font-weight:600;letter-spacing:-.02em}
.strip .n em{font-style:normal;color:var(--accent)}
.strip .k{font-size:12px;color:var(--v4-text-3);margin-top:4px}

/* ---- sections ---- */
section.job{padding:56px 0 8px}
.sec-head{display:flex;align-items:baseline;gap:14px;margin-bottom:6px}
.sec-num{font-size:12px;font-weight:600;color:var(--accent);letter-spacing:.1em}
.sec-head h2{font-size:26px;font-weight:600;letter-spacing:-.02em}
.sec-sub{color:var(--v4-text-3);font-size:14px;margin:0 0 26px;max-width:66ch}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.grid .span2{grid-column:1 / -1}
@media(max-width:820px){.grid{grid-template-columns:1fr}}

/* ---- card ---- */
.card{position:relative;background:var(--v4-surface);border:1px solid var(--v4-border);border-radius:16px;padding:22px 22px 18px;display:flex;flex-direction:column;min-width:0}
.card .chip{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;font-size:11px;font-weight:600;color:var(--accent);background:var(--v4-purple-12);border:1px solid var(--v4-purple-20);border-radius:6px;padding:2px 8px;margin-bottom:12px}
.card h3{font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1.25;margin-bottom:3px}
.card .cap{font-size:12.5px;color:var(--v4-text-3);margin-bottom:16px;line-height:1.45}
.card .plot{margin-top:auto}
.card .read{font-size:12.5px;color:var(--v4-text-2);border-top:1px solid var(--v4-border);margin-top:16px;padding-top:12px;line-height:1.5}
.card .read b{color:var(--v4-text-1);font-weight:600}
.dl{position:absolute;top:12px;right:12px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--v4-text-3);background:transparent;border:1px solid transparent;border-radius:8px;cursor:pointer;opacity:0;transition:opacity .15s,color .15s,background .15s,border-color .15s}
.card:hover .dl,.dl:focus-visible{opacity:1}
.dl:hover,.dl:focus-visible{color:var(--accent);background:var(--v4-purple-12);border-color:var(--v4-purple-20)}
.dl:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.dl svg{width:14px;height:14px}
.dl.busy svg{animation:dlpulse .8s ease-in-out infinite}
.dl.done{color:var(--v4-state-success);opacity:1}
@keyframes dlpulse{0%,100%{opacity:1;transform:translateY(0)}50%{opacity:.35;transform:translateY(2px)}}
@media(hover:none){.dl{opacity:.55}}
svg{display:block;width:100%;height:auto;overflow:visible}
.t1{fill:var(--v4-text-1)} .t2{fill:var(--v4-text-2)} .t3{fill:var(--v4-text-3)}
.axis{stroke:var(--grid);stroke-width:1}
.lbl{font-size:12px} .val{font-size:12px;font-weight:600} .sm{font-size:10.5px}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:14px;font-size:12px;color:var(--v4-text-2)}
.legend .sw{display:inline-flex;align-items:center;gap:7px}
.legend .box{width:11px;height:11px;border-radius:3px}

/* ---- stat tiles ---- */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--v4-border);border:1px solid var(--v4-border);border-radius:12px;overflow:hidden}
.tiles.t5{grid-template-columns:repeat(5,1fr)}
@media(max-width:560px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--v4-surface-2);padding:18px 16px}
.tile .n{font-size:23px;font-weight:600;letter-spacing:-.02em;color:var(--accent)}
.tile .k{font-size:11.5px;color:var(--v4-text-3);margin-top:5px;line-height:1.35}

/* ---- tooltip ---- */
#tt{position:fixed;pointer-events:none;opacity:0;transition:opacity .1s;background:var(--v4-surface-2);border:1px solid var(--v4-border);border-radius:8px;padding:8px 11px;font-size:12px;color:var(--v4-text-1);box-shadow:0 12px 32px -8px rgba(0,0,0,.25);z-index:50;max-width:240px}
#tt .k{color:var(--v4-text-3);font-size:11px}
rect[data-tip],circle[data-tip],line[data-tip]{cursor:crosshair}

.card.ev{padding:16px 16px 12px}
.card.ev h3{font-size:14px}
.card.ev .cap{font-size:11.5px;margin-bottom:10px}
.evhead{grid-column:1/-1;font-size:12px;font-weight:600;color:var(--v4-text-3);letter-spacing:.1em;text-transform:uppercase;margin:14px 0 -4px;border-top:1px dashed var(--v4-border);padding-top:18px}
footer{border-top:1px solid var(--v4-border);margin-top:64px;padding:28px 0 56px}
footer .wrap{color:var(--v4-text-3);font-size:12.5px;line-height:1.6}
footer b{color:var(--v4-text-2)}
a{color:var(--accent)}

/* ---- demo additions ---- */
.demo{font-size:10.5px;font-weight:600;color:var(--v4-state-warning);background:rgba(241,123,44,.12);border:1px solid rgba(241,123,44,.30);border-radius:6px;padding:3px 8px;letter-spacing:.02em;white-space:nowrap}
.nav{margin-left:22px}
table.rec{width:100%;border-collapse:collapse;font-size:12.5px}
table.rec th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--v4-text-3);font-weight:600;padding:0 10px 9px 0;border-bottom:1px solid var(--v4-border);vertical-align:bottom}
table.rec td{padding:11px 10px 11px 0;border-bottom:1px solid var(--v4-border-soft);vertical-align:top;color:var(--v4-text-2)}
table.rec td.ttl{color:var(--v4-text-1);font-weight:500}
table.rec td.rng{white-space:nowrap;font-weight:600;color:var(--v4-text-1)}
.badge{display:inline-block;font-size:10.5px;font-weight:600;border-radius:5px;padding:2px 7px;white-space:nowrap}
.badge.now{color:#0f7a58;background:rgba(56,199,147,.16)}
.badge.pilot{color:#a4590f;background:rgba(241,123,44,.16)}
.badge.test{color:var(--accent);background:var(--v4-purple-12)}
[data-theme='dark'] .badge.now{color:#6fe0b6} [data-theme='dark'] .badge.pilot{color:#f6a765}
@media(max-width:980px){.brand span.nm{display:none}}

</style>
</head>

<script>

/* ================= model ================= */
const M=JSON.parse(document.getElementById('halyard-model').textContent);
const B_=M.base, R_=M.rates, S_=M.sustainers, C_=M.charts, D_=M.derived, E_=M.effects, DN_=M.donors;
function fmt$(n){return n>=1e6?'$'+(n/1e6).toFixed(2)+'M':n>=1e3?'$'+Math.round(n/1e3)+'K':'$'+Math.round(n)}

/* ================= chart engine (self-contained, DS-rooted) ================= */
const PURPLE='#7c3aed', PALT='#a78bfa', PDARK='#6d28d9', GREEN='#38c793', RED='#df1c41', BLUE='#375dfb', ORANGE='#f17b2c';
const tt=document.getElementById('tt');
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function fmtN(n){return n>=1e6?(n/1e6).toFixed(n>=1e7?0:2)+'M':n>=1e3?Math.round(n/1e3)+'K':(''+n)}
document.addEventListener('mousemove',e=>{ if(tt.style.opacity==='1'){tt.style.left=(e.clientX+14)+'px';tt.style.top=(e.clientY+14)+'px';}});
function bindTips(root){
  root.querySelectorAll('[data-tip]').forEach(el=>{
    el.addEventListener('mouseenter',()=>{tt.innerHTML=el.getAttribute('data-tip');tt.style.opacity='1';});
    el.addEventListener('mouseleave',()=>{tt.style.opacity='0';});
  });
}
const svg=(w,h,inner)=>`<svg viewBox="0 0 ${w} ${h}" role="img">${inner}</svg>`;

/* vertical bars: groups=[{label, bars:[{v,color,vlabel}]}], grouped + signed(diverging) */
function barsV(groups,{unit='',h=250,maxOverride=null,fmt=v=>v}={}){
  const W=520,padL=8,padR=8,padT=18,padB=42, plotH=h-padT-padB;
  const vals=groups.flatMap(g=>g.bars.map(b=>b.v));
  const mx=maxOverride??Math.max(...vals,0), mn=Math.min(...vals,0);
  const span=(mx-mn)||1; const y0=padT+plotH*(mx/span);
  const gw=(W-padL-padR)/groups.length; let s='';
  s+=`<line class="axis" x1="${padL}" x2="${W-padR}" y1="${y0}" y2="${y0}"/>`;
  groups.forEach((g,i)=>{
    const n=g.bars.length, bw=Math.min(64,(gw-16)/n), gx=padL+i*gw+(gw-bw*n)/2;
    g.bars.forEach((b,j)=>{
      const bh=Math.abs(b.v)/span*plotH, x=gx+j*bw, y=b.v>=0?y0-bh:y0;
      s+=`<rect x="${x+3}" y="${y}" width="${bw-6}" height="${Math.max(bh,1)}" rx="6" fill="${b.color}" data-tip="${b.tip||(esc(b.name||g.label)+': <b>'+fmt(b.v)+unit+'</b>')}"/>`;
      const vy=b.v>=0?y-6:y+bh+13;
      s+=`<text class="val t1" x="${x+bw/2}" y="${vy}" text-anchor="middle">${b.vlabel??(fmt(b.v)+unit)}</text>`;
      if(b.note) s+=`<text class="sm" x="${x+bw/2}" y="${vy-14}" text-anchor="middle" fill="${b.noteCol||RED}">${b.note}</text>`;
    });
    (g.label||'').split('\n').forEach((ln,k)=>{
      s+=`<text class="lbl t3" x="${padL+i*gw+gw/2}" y="${h-padB+30+k*13}" text-anchor="middle">${esc(ln)}</text>`;});
  });
  return svg(W,h,s);
}

/* horizontal bars: rows=[{label,v,color,vlabel}] */
function barsH(rows,{unit='',fmt=v=>v,rowH=30,labelW=190,maxOverride=null}={}){
  const W=520,padR=70,padT=6, h=padT*2+rows.length*rowH;
  const mx=maxOverride??Math.max(...rows.map(r=>r.v),0);
  const plotW=W-labelW-padR; let s='';
  rows.forEach((r,i)=>{
    const y=padT+i*rowH, bw=r.v/mx*plotW, cy=y+rowH/2;
    s+=`<text class="lbl t2" x="${labelW-10}" y="${cy+4}" text-anchor="end">${esc(r.label)}</text>`;
    s+=`<rect x="${labelW}" y="${y+5}" width="${Math.max(bw,1)}" height="${rowH-11}" rx="4" fill="${r.color||PURPLE}" data-tip="${esc(r.label)}: <b>${r.vlabel??fmt(r.v)+unit}</b>"/>`;
    s+=`<text class="val t1" x="${labelW+bw+8}" y="${cy+4}">${r.vlabel??(fmt(r.v)+unit)}</text>`;
  });
  return svg(W,h,s);
}

/* funnel: left-aligned bars, labels to the side (no overflow) */
function funnel(steps){
  const W=520,rowH=44,padT=8,h=padT*2+steps.length*rowH, labelW=158, padR=86;
  const mx=steps[0].v, plotW=W-labelW-padR; let s='';
  steps.forEach((st,i)=>{
    const y=padT+i*rowH, bw=st.v/mx*plotW, cy=y+rowH/2, pct=st.v/mx*100;
    const a=(0.9-0.5*(i/(steps.length-1))).toFixed(2);
    s+=`<text class="lbl t2" x="${labelW-12}" y="${cy+4}" text-anchor="end">${esc(st.label)}</text>`;
    s+=`<rect x="${labelW}" y="${y+7}" width="${Math.max(bw,3)}" height="${rowH-14}" rx="6" fill="rgba(124,58,237,${a})" data-tip="${esc(st.label)}: <b>${st.v.toLocaleString()}</b> (${pct.toFixed(pct<10?1:0)}%)"/>`;
    s+=`<text class="val t1" x="${labelW+bw+9}" y="${cy}">${fmtN(st.v)}</text>`;
    s+=`<text class="sm t3" x="${labelW+bw+9}" y="${cy+13}">${pct.toFixed(pct<10?1:0)}%</text>`;
  });
  return svg(W,h,s);
}

/* stacked part-to-whole (horizontal single bar): segs=[{label,v,color}] */
function stackedH(segs,{unit='',fmt=v=>v.toLocaleString()}={}){
  const W=520,barY=8,barH=44, total=segs.reduce((a,b)=>a+b.v,0), plotW=W-4; let x=2,s='';
  segs.forEach((sg)=>{
    const w=sg.v/total*plotW, pct=sg.v/total*100;
    s+=`<rect x="${x+1}" y="${barY}" width="${Math.max(w-2,1)}" height="${barH}" rx="4" fill="${sg.color}" data-tip="${esc(sg.label)}: <b>${fmt(sg.v)}${unit}</b> (${pct.toFixed(0)}%)"/>`;
    if(w>44) s+=`<text class="val" x="${x+w/2}" y="${barY+barH/2+1}" text-anchor="middle" fill="${sg.dark?'#12101a':'#fff'}">${pct.toFixed(0)}%</text>`;
    x+=w;
  });
  let ly=barY+barH+22, lx=2;
  segs.forEach(sg=>{ const t=esc(sg.label)+'  '+fmt(sg.v); s+=`<rect x="${lx}" y="${ly-9}" width="10" height="10" rx="2" fill="${sg.color}"/><text class="sm t2" x="${lx+15}" y="${ly}">${t}</text>`; lx+=15+(t.length*5.9)+22; if(lx>W-130){lx=2;ly+=18;} });
  return svg(W,ly+8,s);
}

/* slope with label dodging (avoids overlap when series cluster) */
function slope(items,{leftLab,rightLab,unit='%'}){
  const W=520,padT=34,padB=16,h=340,plotH=h-padT-padB, xL=152,xR=W-152;
  const mx=Math.max(...items.flatMap(i=>[i.from,i.to]))*1.03;
  const Y=v=>padT+plotH*(1-v/mx); let s='';
  s+=`<text class="sm t3" x="${xL}" y="18" text-anchor="middle">${leftLab}</text><text class="sm t3" x="${xR}" y="18" text-anchor="middle">${rightLab}</text>`;
  s+=`<line class="axis" x1="${xL}" x2="${xL}" y1="${padT-4}" y2="${h-padB}"/><line class="axis" x1="${xR}" x2="${xR}" y1="${padT-4}" y2="${h-padB}"/>`;
  items.forEach(it=>{
    const y1=Y(it.from),y2=Y(it.to),col=it.color||PURPLE;
    s+=`<line x1="${xL}" y1="${y1}" x2="${xR}" y2="${y2}" stroke="${col}" stroke-width="2" data-tip="${esc(it.label)}: <b>${it.from}${unit} → ${it.to}${unit}</b>"/>`;
    s+=`<circle cx="${xL}" cy="${y1}" r="4" fill="${col}"/><circle cx="${xR}" cy="${y2}" r="4" fill="${col}"/>`;
  });
  const gap=15, dodge=arr=>{ arr.sort((a,b)=>a.ty-b.ty);
    for(let i=1;i<arr.length;i++) if(arr[i].ty-arr[i-1].ty<gap) arr[i].ty=arr[i-1].ty+gap;
    const over=arr.length?arr[arr.length-1].ty-(h-padB):0; if(over>0) arr.forEach(o=>o.ty-=over);
    const under=arr.length?padT-arr[0].ty:0; if(under>0) arr.forEach(o=>o.ty+=under); return arr; };
  dodge(items.map(it=>({y:Y(it.from),ty:Y(it.from),t:`${it.label} ${it.from}${unit}`,c:it.color||PURPLE}))).forEach(o=>{
    if(Math.abs(o.ty-o.y)>1.5) s+=`<line x1="${xL-7}" y1="${o.y}" x2="${xL-11}" y2="${o.ty}" stroke="${o.c}" stroke-width="1" opacity=".45"/>`;
    s+=`<text class="sm t2" x="${xL-13}" y="${o.ty+3}" text-anchor="end">${esc(o.t)}</text>`; });
  dodge(items.map(it=>({y:Y(it.to),ty:Y(it.to),t:`${it.to}${unit}`,c:it.color||PURPLE}))).forEach(o=>{
    if(Math.abs(o.ty-o.y)>1.5) s+=`<line x1="${xR+7}" y1="${o.y}" x2="${xR+11}" y2="${o.ty}" stroke="${o.c}" stroke-width="1" opacity=".45"/>`;
    s+=`<text class="sm t1" x="${xR+13}" y="${o.ty+3}">${esc(o.t)}</text>`; });
  return svg(W,h,s);
}

/* multi-year trend: series=[{label,vals:[...],color}]; partial = indices of partial-year columns (hollow dots + dashed segments) */
function trend(series,{cols,partial=[],unit='%'}){
  const W=520,padT=34,padB=26,h=340,plotH=h-padT-padB, xL=150,xR=W-56;
  const n=cols.length, X=i=>xL+(xR-xL)*i/(n-1);
  const mx=Math.max(...series.flatMap(sr=>sr.vals))*1.05;
  const Y=v=>padT+plotH*(1-v/mx); let s='';
  cols.forEach((c,i)=>{
    s+=`<line class="axis" x1="${X(i)}" x2="${X(i)}" y1="${padT-4}" y2="${h-padB}"/>`;
    s+=`<text class="sm t3" x="${X(i)}" y="18" text-anchor="middle">${esc(c)}</text>`;
  });
  series.forEach((sr,si)=>{
    const col=sr.color||PURPLE;
    for(let i=0;i<n-1;i++){
      const dash=(partial.includes(i)||partial.includes(i+1))?' stroke-dasharray="5 4" opacity=".7"':'';
      s+=`<line x1="${X(i)}" y1="${Y(sr.vals[i])}" x2="${X(i+1)}" y2="${Y(sr.vals[i+1])}" stroke="${col}" stroke-width="2"${dash} data-tip="${esc(sr.label)}: <b>${sr.vals[i]}${unit} → ${sr.vals[i+1]}${unit}</b> (${esc(cols[i])} → ${esc(cols[i+1])})"/>`;
    }
    sr.vals.forEach((v,i)=>{
      const hollow=partial.includes(i);
      s+=`<circle cx="${X(i)}" cy="${Y(v)}" r="4" fill="${hollow?'#fff':col}" stroke="${col}" stroke-width="${hollow?2:0}" data-tip="${esc(sr.label)} ${esc(cols[i])}: <b>${v}${unit}</b>${hollow?' (partial year)':''}"/>`;
    });
    if(si===0){ for(let i=1;i<n-1;i++) s+=`<text class="val t1" x="${X(i)}" y="${Y(sr.vals[i])-9}" text-anchor="middle">${sr.vals[i]}${unit}</text>`; }
  });
  const gap=15, dodge=arr=>{ arr.sort((a,b)=>a.ty-b.ty);
    for(let i=1;i<arr.length;i++) if(arr[i].ty-arr[i-1].ty<gap) arr[i].ty=arr[i-1].ty+gap;
    const over=arr.length?arr[arr.length-1].ty-(h-padB):0; if(over>0) arr.forEach(o=>o.ty-=over);
    const under=arr.length?padT-arr[0].ty:0; if(under>0) arr.forEach(o=>o.ty+=under); return arr; };
  const ast=i=>partial.includes(i)?'*':'';
  dodge(series.map(sr=>({y:Y(sr.vals[0]),ty:Y(sr.vals[0]),t:`${sr.label} ${sr.vals[0]}${unit}${ast(0)}`,c:sr.color||PURPLE}))).forEach(o=>{
    if(Math.abs(o.ty-o.y)>1.5) s+=`<line x1="${xL-7}" y1="${o.y}" x2="${xL-11}" y2="${o.ty}" stroke="${o.c}" stroke-width="1" opacity=".45"/>`;
    s+=`<text class="sm t2" x="${xL-13}" y="${o.ty+3}" text-anchor="end">${esc(o.t)}</text>`; });
  dodge(series.map(sr=>({y:Y(sr.vals[n-1]),ty:Y(sr.vals[n-1]),t:`${sr.vals[n-1]}${unit}${ast(n-1)}`,c:sr.color||PURPLE}))).forEach(o=>{
    if(Math.abs(o.ty-o.y)>1.5) s+=`<line x1="${xR+7}" y1="${o.y}" x2="${xR+11}" y2="${o.ty}" stroke="${o.c}" stroke-width="1" opacity=".45"/>`;
    s+=`<text class="sm t1" x="${xR+13}" y="${o.ty+3}">${esc(o.t)}</text>`; });
  return svg(W,h,s);
}

/* dumbbell: rows=[{label,a,b,color}] — era (hollow) vs now (solid) */
function dumbbell(rows,{fmt=v=>'$'+v,labelW=200,legend=true,was='was'}={}){
  const W=520,rowH=31,padT=26,padR=132,h=padT+rows.length*rowH+8;
  const mx=Math.max(...rows.flatMap(r=>[r.a,r.b]))*1.06, plotW=W-labelW-padR;
  const X=v=>labelW+v/mx*plotW; let s='';
  const dir=r=>r.b-r.a>5?GREEN:(r.b-r.a<-5?RED:'var(--neutral)');
  if(legend){s+=`<circle cx="14" cy="14" r="4.5" fill="var(--v4-bg)" stroke="var(--neutral)" stroke-width="2"/><text class="sm t3" x="23" y="18">2022 to early-2025</text>`;
  s+=`<circle cx="152" cy="14" r="4.5" fill="${GREEN}"/><text class="sm t3" x="161" y="18">rose</text>`;
  s+=`<circle cx="208" cy="14" r="4.5" fill="${RED}"/><text class="sm t3" x="217" y="18">fell</text>`;

/* tiers: rows=[{label,segs:[{v,color,name}]}] — labeled 100% stacked bars */
function tiers(rows){
  const W=520,labelW=170,barH=30,rowGap=20,padT=6;
  let y=padT,s='';
  rows.forEach(r=>{
    const total=r.segs.reduce((a,b)=>a+b.v,0), plotW=W-labelW-8; let x=labelW;
    s+=`<text class="lbl t2" x="${labelW-10}" y="${y+barH/2+4}" text-anchor="end">${esc(r.label)}</text>`;
    r.segs.forEach(sg=>{
      const w=sg.v/total*plotW, pct=sg.v/total*100;
      if(pct<0.5){
        s+=`<line x1="${x+1}" y1="${y-4}" x2="${x+1}" y2="${y+barH+4}" stroke="${sg.color}" stroke-width="3" data-tip="${esc(sg.name)}: <b>0%</b>"/>`;
        s+=`<text class="val t1" x="${x+7}" y="${y-7}">0% ${esc(sg.name.toLowerCase())}</text>`;
      } else {
        s+=`<rect x="${x+1}" y="${y}" width="${Math.max(w-2,1)}" height="${barH}" rx="4" fill="${sg.color}" data-tip="${esc(sg.name)}: <b>${pct.toFixed(pct<10?1:0)}%</b> (${fmtN(sg.v)})"/>`;
        if(w>34) s+=`<text class="val" x="${x+w/2}" y="${y+barH/2+1}" text-anchor="middle" fill="${sg.dark?'#12101a':'#fff'}">${pct.toFixed(0)}%</text>`;
      }
      x+=w;
    });
    y+=barH+rowGap;
  });
  let lx=labelW,ly=y+8;
  [['Never click or act','var(--neutral)'],['1–2 clicks/actions',PALT],['3+ (engaged)',PURPLE]].forEach(([t,c])=>{
    s+=`<rect x="${lx}" y="${ly-9}" width="10" height="10" rx="2" fill="${c}"/><text class="sm t2" x="${lx+15}" y="${ly}">${t}</text>`; lx+=15+t.length*6+22;});
  return svg(W,ly+8,s);
}


/* matrix heatmap */
function matrix(rows,cols,cells,{rowTot,colTot}){
  const W=560,cellW=74,cellH=40,labelW=W-cols.length*cellW-40,padT=30;
  const mx=Math.max(...cells.flat()); let s='';
  cols.forEach((c,j)=>{ s+=`<text class="sm t3" x="${labelW+j*cellW+cellW/2}" y="${padT-10}" text-anchor="middle">${esc(c)}</text>`; });
  s+=`<text class="sm t3" x="${labelW+cols.length*cellW+8}" y="${padT-10}">Total</text>`;
  rows.forEach((r,i)=>{
    const y=padT+i*cellH;
    s+=`<text class="lbl t2" x="${labelW-10}" y="${y+cellH/2+4}" text-anchor="end">${esc(r)}</text>`;
    cols.forEach((c,j)=>{
      const v=cells[i][j], x=labelW+j*cellW, a=v===0?0:.12+.78*(v/mx);
      s+=`<rect x="${x+2}" y="${y+2}" width="${cellW-4}" height="${cellH-4}" rx="6" fill="rgba(124,58,237,${a.toFixed(3)})" stroke="var(--v4-border)" data-tip="${esc(r)} · ${esc(c)}: <b>${v}</b>"/>`;
      if(v>0) s+=`<text class="val" x="${x+cellW/2}" y="${y+cellH/2+4}" text-anchor="middle" fill="${a>.5?'#fff':'var(--v4-text-2)'}">${v}</text>`;
    });
    s+=`<text class="val t3" x="${labelW+cols.length*cellW+8}" y="${y+cellH/2+4}">${rowTot[i]}</text>`;
  });
  const yb=padT+rows.length*cellH;
  s+=`<text class="sm t3" x="${labelW-10}" y="${yb+16}" text-anchor="end">Total</text>`;
  cols.forEach((c,j)=>{ s+=`<text class="val t3" x="${labelW+j*cellW+cellW/2}" y="${yb+16}" text-anchor="middle">${colTot[j]}</text>`; });
  return svg(W,yb+26,s);
}

/* net flow: three bands — the running plan count, the starts and stops behind it,
   and the month's net change as diverging bars */
function netFlow(rows,{startTotal,fmt=v=>v.toLocaleString()}={}){
  const W=1080,h=470,padL=76,padR=104,topY=30,botY=h-58;
  const n=rows.length, X=i=>padL+i*(W-padL-padR)/(n-1);
  const zone=(botY-topY);
  const A=[topY, topY+zone*0.26];            // active plans
  const Bz=[topY+zone*0.36, topY+zone*0.66]; // started / stopped
  const Cz=[topY+zone*0.74, botY];           // net bars
  const nets=rows.map(r=>r.started-r.stopped);
  let run=startTotal; const totals=rows.map(r=>(run+=r.started-r.stopped));
  let s='';
  const band=(y0,y1,lab)=>{ s+=`<text class="sm t3" x="${padL}" y="${y0-9}">${lab}</text>`; };

  /* A: running total */
  band(A[0],A[1],'ACTIVE PLANS (running total)');
  const loT=Math.min(...totals,startTotal), hiT=Math.max(...totals,startTotal), padT2=(hiT-loT)*0.35+1;
  const Yt=v=>A[1]-(v-loT+padT2*0.5)/((hiT-loT)+padT2)*(A[1]-A[0]);
  let d=''; totals.forEach((v,i)=>{d+=(i?'L':'M')+X(i).toFixed(1)+' '+Yt(v).toFixed(1)+' ';});
  s+=`<path d="${d}" fill="none" stroke="${PURPLE}" stroke-width="2.5" stroke-linejoin="round"/>`;
  totals.forEach((v,i)=>{s+=`<circle cx="${X(i)}" cy="${Yt(v)}" r="4" fill="${PURPLE}" data-tip="<b>${esc(rows[i].m)}</b><div class=k>active plans</div>${fmt(v)}"/>`;});
  s+=`<text class="val" x="${X(n-1)+10}" y="${Yt(totals[n-1])+4}" fill="${PURPLE}">${fmt(totals[n-1])} plans</text>`;

  /* B: starts and stops */
  band(Bz[0],Bz[1],'PLANS STARTED AND STOPPED');
  const mxB=Math.max(...rows.map(r=>Math.max(r.started,r.stopped)))*1.12;
  const Yb=v=>Bz[1]-(v/mxB)*(Bz[1]-Bz[0]);
  s+=`<line class="axis" x1="${padL}" x2="${W-padR}" y1="${Bz[1]}" y2="${Bz[1]}"/>`;
  [['started',GREEN],['stopped',RED]].forEach(([key,col])=>{
    let p2=''; rows.forEach((r,i)=>{p2+=(i?'L':'M')+X(i).toFixed(1)+' '+Yb(r[key]).toFixed(1)+' ';});
    s+=`<path d="${p2}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round"/>`;
    rows.forEach((r,i)=>{s+=`<circle cx="${X(i)}" cy="${Yb(r[key])}" r="3.4" fill="${col}" data-tip="<b>${esc(r.m)}</b><div class=k>plans ${key}</div>${fmt(r[key])}"/>`;});
    s+=`<text class="val" x="${X(n-1)+10}" y="${Yb(rows[n-1][key])+4}" fill="${col}">${fmt(rows[n-1][key])} ${key}</text>`;
  });

  /* C: net bars */
  band(Cz[0],Cz[1],'NET CHANGE EACH MONTH');
  const mxN=Math.max(...nets.map(Math.abs))*1.3, mid=(Cz[0]+Cz[1])/2;
  const Yn=v=>mid-(v/mxN)*((Cz[1]-Cz[0])/2);
  s+=`<line class="axis" x1="${padL-10}" x2="${W-padR+6}" y1="${mid}" y2="${mid}"/>`;
  const bw=Math.min(40,(W-padL-padR)/n*0.56);
  rows.forEach((r,i)=>{
    const v=r.started-r.stopped, y=v>=0?Yn(v):mid, hh=Math.abs(Yn(v)-mid);
    s+=`<rect x="${X(i)-bw/2}" y="${y}" width="${bw}" height="${Math.max(hh,1.5)}" rx="4" fill="${v>=0?GREEN:RED}" data-tip="<b>${esc(r.m)}</b><div class=k>${fmt(r.started)} started &middot; ${fmt(r.stopped)} stopped</div>net ${v>=0?'+':''}${fmt(v)}"/>`;
    s+=`<text class="sm" x="${X(i)}" y="${v>=0?y-6:y+hh+13}" text-anchor="middle" fill="${v>=0?GREEN:RED}">${v>=0?'+':''}${v}</text>`;
    s+=`<text class="sm t3" x="${X(i)}" y="${botY+22}" text-anchor="middle">${esc(r.m)}</text>`;
  });
  return svg(W,h,s);
}

/* cumulative curve over many columns: gridlines, end labels only, legend carries the names.
   FA's trend() is built for four or five columns; twelve crowds its per-point labels. */
function curve(series,{cols,unit='%',h=312,xLab='',yLab='',baseline=null,baseLab='',mark=null}={}){
  const W=520,padT=32,padB=42,padL=38,padR=52,plotH=h-padT-padB;
  const n=cols.length, X=i=>padL+(W-padL-padR)*i/(n-1);
  const mx=Math.max(...series.flatMap(sr=>sr.vals),baseline||0)*1.14;
  const Y=v=>padT+plotH*(1-v/mx); let s='';
  if(yLab) s+=`<text class="sm t3" x="${padL-34}" y="${padT-12}">${esc(yLab)}</text>`;
  /* round the axis top up to a clean step so ticks never repeat after rounding */
  const rawStep=mx/4, mag=Math.pow(10,Math.floor(Math.log10(rawStep)));
  const step=[1,2,2.5,5,10].map(k=>k*mag).find(k=>k>=rawStep)||10*mag;
  const top=step*4, dec=step<1?(step<0.2?2:1):0;
  const Y2=v=>padT+plotH*(1-v/top);
  for(let g=0;g<=4;g++){const v=step*(4-g), y=Y2(v);
    s+=`<line class="axis" x1="${padL}" x2="${W-padR}" y1="${y}" y2="${y}"/>`;
    s+=`<text class="sm t3" x="${padL-7}" y="${y+3.5}" text-anchor="end">${v.toFixed(dec)}${unit}</text>`;}
  cols.forEach((c,i)=>{if(n<=7||i%2===1||i===n-1)
    s+=`<text class="sm t3" x="${X(i)}" y="${h-padB+17}" text-anchor="middle">${esc(c)}</text>`;});
  if(xLab) s+=`<text class="sm t3" x="${(padL+W-padR)/2}" y="${h-padB+33}" text-anchor="middle">${esc(xLab)}</text>`;
  const Yv=Y2;
  if(baseline!=null){
    /* shade the gap between the curve and the baseline: the gap is the lift */
    const sr0=series[0];
    let area='M'+X(0)+' '+Yv(sr0.vals[0]);
    sr0.vals.forEach((v,i)=>{area+=' L'+X(i).toFixed(1)+' '+Yv(v).toFixed(1);});
    area+=' L'+X(n-1).toFixed(1)+' '+Yv(baseline).toFixed(1)+' L'+X(0).toFixed(1)+' '+Yv(baseline).toFixed(1)+' Z';
    s+=`<path d="${area}" fill="${sr0.color}" opacity=".13"/>`;
    s+=`<line x1="${padL}" x2="${W-padR}" y1="${Yv(baseline)}" y2="${Yv(baseline)}" stroke="var(--neutral)" stroke-width="1.8" stroke-dasharray="6 5"/>`;
    if(baseLab) s+=`<text class="sm t3" x="${padL+4}" y="${Yv(baseline)+15}">${esc(baseLab)}</text>`;
    s+=`<text class="val t3" x="${W-padR+7}" y="${Yv(baseline)+4}">${baseline}</text>`;
  }
  series.forEach(sr=>{
    let d=''; sr.vals.forEach((v,i)=>{d+=(i?'L':'M')+X(i).toFixed(1)+' '+Yv(v).toFixed(1)+' ';});
    s+=`<path d="${d}" fill="none" stroke="${sr.color}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`;
    sr.vals.forEach((v,i)=>{s+=`<circle cx="${X(i)}" cy="${Yv(v)}" r="3.2" fill="${sr.color}" data-tip="<b>${esc(sr.label)}</b><div class=k>${esc(cols[i])}</div>${v.toFixed(dec||1)}${unit}"/>`;});
    const last=sr.vals[n-1];
    s+=`<text class="val" x="${W-padR+7}" y="${Yv(last)+4}" fill="${sr.color}">${last.toFixed(dec)}${unit}</text>`;
    /* one callout on the point that carries the finding, instead of labelling all of them */
    if(mark!=null&&sr===series[0]){
      const v=sr.vals[mark];
      s+=`<circle cx="${X(mark)}" cy="${Yv(v)}" r="5.5" fill="${sr.color}" stroke="var(--v4-surface)" stroke-width="2"/>`;
      s+=`<text class="val" x="${X(mark)}" y="${Yv(v)-11}" text-anchor="middle" fill="${sr.color}" stroke="var(--v4-surface)" stroke-width="4" paint-order="stroke">${v.toFixed(1)}${unit}</text>`;
    }
  });
  return svg(W,h,s);
}

const DL_ICON='<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 1.8v7.6"/><path d="m4.1 6.6 2.9 2.8 2.9-2.8"/><path d="M2.2 12.2h9.6"/></svg>';

let _fontCssP=null;
function fontCssInline(){ /* Geist woff2 as data: URIs so the rasterized SVG document can use the page font */
  if(_fontCssP) return _fontCssP;
  _fontCssP=(async()=>{
    const raw=await (await fetch('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap')).text();
    const css=raw.split(/(?=\/\* )/).filter(b=>/^\/\* latin/.test(b)).join('')||raw; /* latin subsets only — keeps the data URL small */
    const urls=[...new Set([...css.matchAll(/url\((https:[^)]+)\)/g)].map(m=>m[1]))];
    const pairs=await Promise.all(urls.map(async u=>{
      const b=await (await fetch(u)).blob();
      const d=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b);});
      return [u,d];
    }));
    return pairs.reduce((s,[u,d])=>s.split(u).join(d),css);
  })().catch(()=>'');
  return _fontCssP;
}
const SVG_COPY=['fill','fill-opacity','stroke','stroke-width','stroke-dasharray','stroke-linecap','stroke-linejoin','opacity','font-family','font-size','font-weight','font-style','letter-spacing','text-anchor','dominant-baseline','overflow','paint-order','mix-blend-mode','transform','transform-origin'];
function cloneStyled(src){ /* deep clone with computed styles inlined; buttons (incl. this one) excluded */
  const dst=src.cloneNode(false), cs=getComputedStyle(src);
  if(src.namespaceURI==='http://www.w3.org/2000/svg'){
    SVG_COPY.forEach(p=>dst.style.setProperty(p,cs.getPropertyValue(p)));
    if(src.tagName.toLowerCase()==='svg'){const r=src.getBoundingClientRect();dst.style.setProperty('display','block');dst.style.setProperty('width',r.width+'px');dst.style.setProperty('height',r.height+'px');}
  }else{
    for(let i=0;i<cs.length;i++){const p=cs[i];dst.style.setProperty(p,cs.getPropertyValue(p));}
    if(cs.display!=='inline'){const r=src.getBoundingClientRect();dst.style.setProperty('box-sizing','border-box');dst.style.setProperty('width',r.width+'px');dst.style.setProperty('height',r.height+'px');}
  }
  src.childNodes.forEach(ch=>{
    if(ch.nodeType===1){ if(ch.tagName==='BUTTON') return; dst.appendChild(cloneStyled(ch)); }
    else if(ch.nodeType===3) dst.appendChild(ch.cloneNode());
  });
  return dst;
}
async function cardToPng(card){

  const cv=document.createElement('canvas'); cv.width=W*scale; cv.height=H*scale;
  const ctx=cv.getContext('2d'); ctx.scale(scale,scale);
  ctx.fillStyle=getComputedStyle(document.body).backgroundColor; ctx.fillRect(0,0,W,H);
  ctx.drawImage(img,0,0,W,H);
  return await new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej(new Error('toBlob failed')),'image/png'));
}
async function exportCard(card,btn){
  if(btn.classList.contains('busy')) return;
  btn.classList.add('busy');
  try{
    const png=await cardToPng(card);
    const name='fa-'+((card.querySelector('h3')||{}).textContent||'chart').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60)+'.png';
    const a=document.createElement('a'); a.href=URL.createObjectURL(png); a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    btn.innerHTML=OK_ICON; btn.classList.add('done');
    setTimeout(()=>{btn.innerHTML=DL_ICON;btn.classList.remove('done');},1500);
  }catch(e){ console.error('PNG export failed:',e); }
  finally{ btn.classList.remove('busy'); }
}
